{% load static %}
<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="STEP IT Academy - Python və maraqlı mövzularda blog">
    <title>{% block title %}STEP Blog{% endblock %} | STEP Blog</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="shell header-inner">
            <a href="{% url 'blog:post_list' %}" class="brand" aria-label="STEP Blog - Ana səhifə"><span class="brand-mark">S</span>STEP <strong>Blog</strong></a>
            {% include "partials/navbar.html" %}
        </div>
    </header>
    <main class="shell main-content">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="shell footer-inner"><span>STEP IT Academy · Python Web Development</span><span>© {% now "Y" %} STEP Blog</span></div>
    </footer>
    <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
